[project]
name = "amulen-mcp"
version = "1.0.0"
description = "Servidor MCP para AMULEN sobre la API v1 (token personal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",  # API FastMCP; migrar a MCPServer (mcp 2.x) más adelante
  "httpx>=0.27",
]

[project.scripts]
amulen-mcp = "amulen_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amulen_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
