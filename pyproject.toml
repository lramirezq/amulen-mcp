[project]
name = "amulen-mcp"
version = "1.2.0"
description = "Servidor MCP para AMULEN (proyectos, tableros y tareas) sobre su API v1"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis Ramirez" }]
keywords = ["mcp", "amulen", "model-context-protocol", "claude", "project-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Groupware",
]
dependencies = [
  "mcp>=1.9,<2",  # API FastMCP; migrar a MCPServer (mcp 2.x) más adelante
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/lramirezq/amulen-mcp"
Issues = "https://github.com/lramirezq/amulen-mcp/issues"

[project.scripts]
amulen-mcp = "amulen_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/amulen_mcp", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/amulen_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
