name: Publicar en PyPI

# Se publica SOLO al hacer push de un tag vX.Y.Z que coincida con la versión de
# pyproject.toml. Usa Trusted Publishing (OIDC): no hay tokens de PyPI guardados.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verificar que el tag coincide con la versión
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != versión v$VERSION"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Revisar contenido del paquete
        run: |
          tar -tzf dist/*.tar.gz
          if tar -tzf dist/*.tar.gz | grep -qE '(\.env|\.pem|\.key)$'; then echo "Archivo sensible en el paquete"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amulen-mcp/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
